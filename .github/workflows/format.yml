name: format

on:
  push:
    branches: [main]

# This job pushes a commit back to main, so it needs write. It used to get it
# by inheriting the repository default, which meant every other workflow here
# inherited it too. Asking for it explicitly is what lets that default be
# turned down to read-only.
permissions:
  contents: write

concurrency:
  group: format-main
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      # `github.head_ref` is empty on a push event, so the old `ref:` here was
      # a no-op that read as if it did something. This workflow only ever runs
      # on main; check that out and say so.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.14'

      - name: Install formatter dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "black>=26,<27"  # the pin in pyproject's dev extra

      - name: Format with black
        run: |
          black jupyddl tests tools

      # web/dist embeds the jupyddl sources verbatim, and pages.yml refuses to
      # deploy a bundle that has drifted from them. Reformatting the sources
      # and committing without rebuilding would push main into exactly that
      # state, so the rebuild has to ride along in the same commit.
      - name: Rebuild the browser bundle so it matches the formatted sources
        run: python tools/build_web.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7
        with:
          commit_message: Apply formatting changes
          branch: main

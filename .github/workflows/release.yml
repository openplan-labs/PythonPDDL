name: release

# Every merge to main can be a release, and nobody has to approve anything.
#
# On a push to main, `plan` looks up the pull request that was just merged and
# picks the bump its commits ask for (tools/release.py, Conventional Commits):
#
#     feat!: / fix!: / a "BREAKING CHANGE:" footer  -> major
#     feat:                                          -> minor
#     fix: / perf:                                   -> patch
#     docs:, chore:, ci:, test:, refactor: ...       -> no release
#
# taking the largest over the PR title, every commit in it, and every commit
# on main since the last tag (so a merge whose run was dropped as a duplicate
# pending run still counts). A `release:major|minor|patch|none` label on the
# PR overrides that.
#
# `bump` then bumps pyproject.toml, jupyddl.__version__ and CITATION.cff,
# dates the [Unreleased] changelog section, rebuilds web/dist (which records
# the version), commits that to main and tags it -- with the workflow's own
# token, which may push but may not open pull requests. That is the whole
# trick: no release PR, so no "allow Actions to create pull requests" setting
# and no approval. Its pushes start no workflows, so nothing loops; it starts
# `pages` explicitly so the site shows the new version.
#
# The same build, checks and PyPI publish also run on a hand-pushed `v*` tag,
# or from the Actions tab (target `testpypi` rehearses without tagging).
#
# Authentication is PyPI **Trusted Publishing** (OIDC) for this file,
# release.yml, in the `pypi` environment -- no stored token. See
# `.docs/RELEASING.md` for the one-time PyPI setup.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: "Where to publish (pypi also tags and cuts the release)"
        required: true
        default: testpypi
        type: choice
        options: [testpypi, pypi]

# One release at a time, in merge order, never cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: decide what to release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      part: ${{ steps.plan.outputs.part }}
      note: ${{ steps.plan.outputs.note }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: false
          fetch-depth: 0  # the commits since the last tag count too

      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0] // empty')"
          pr="${pr:-null}"
          number="$(jq -r '.number // empty' <<<"$pr")"
          commits='[]'
          if [ -n "$number" ]; then
            commits="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${number}/commits" --paginate \
              --jq '[.[].commit.message]' | jq -s 'add // []')"
          fi
          jq -n --argjson pr "$pr" --argjson commits "$commits" --arg head "$HEAD_MESSAGE" \
            '{labels: [($pr.labels // [])[].name],
              messages: ([$head, ($pr.title // "")] + $commits)}' > pr.json
          part="$(python3 tools/release.py plan --since-last-tag < pr.json)"
          title="$(jq -r '.title // empty' <<<"$pr")"
          note="${title}${number:+ (#${number})}"
          echo "PR ${number:-none}: ${title:-$(head -n1 <<<"$HEAD_MESSAGE")} -> release: ${part}"
          if [ "$part" != none ]; then echo "part=${part}" >> "$GITHUB_OUTPUT"; fi
          {
            echo "note<<__NOTE__"
            echo "${note:-$(head -n1 <<<"$HEAD_MESSAGE")}"
            echo "__NOTE__"
          } >> "$GITHUB_OUTPUT"

  bump:
    name: bump, commit and tag
    needs: plan
    if: needs.plan.outputs.part != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write  # push the release commit and its tag to main
      actions: write   # start `pages`: our own push starts no workflows
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          submodules: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - id: bump
        env:
          PART: ${{ needs.plan.outputs.part }}
          NOTE: ${{ needs.plan.outputs.note }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(python tools/release.py apply "$PART" --note "$NOTE" | tail -n1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "chore(release): ${version}"
          git tag -a "v${version}" -m "jupyddl ${version}"
          # Another push may have landed on main meanwhile (the format job);
          # replay the release commit on top of it once rather than fail.
          if ! git push origin HEAD:main; then
            git fetch origin main
            git rebase origin/main
            git tag -f -a "v${version}" -m "jupyddl ${version}"
            git push origin HEAD:main
          fi
          git push origin "v${version}"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main || \
            echo "::warning::could not start pages; it will deploy on the next push"

  build:
    name: build and verify
    needs: [plan, bump]
    # A merge that asked for a release, a pushed tag, or a run from the tab.
    if: >-
      !cancelled()
      && (needs.bump.result == 'success'
          || startsWith(github.ref, 'refs/tags/')
          || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.bump.outputs.tag || github.ref }}
          submodules: false
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'

      - name: Read the version the package declares
        id: version
        env:
          BUMP_TAG: ${{ needs.bump.outputs.tag }}
        run: |
          version=$(python -c "import re,pathlib; \
            print(re.search(r'^version = \"([^\"]+)\"', \
            pathlib.Path('pyproject.toml').read_text(), re.M).group(1))")
          tag="${BUMP_TAG}"
          if [ -z "$tag" ] && [ "${GITHUB_REF_TYPE}" = tag ]; then tag="${GITHUB_REF_NAME}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "pyproject declares $version${tag:+, releasing $tag}"

      # A dispatch from a branch creates the tag itself. If that version was
      # already released, PyPI would quietly skip the files (skip-existing)
      # while the existing GitHub Release had its assets replaced from a
      # different commit. Refuse: a new release needs a new version.
      - name: Refuse to release a version twice
        if: >-
          github.event_name == 'workflow_dispatch'
          && github.event.inputs.target == 'pypi'
          && !startsWith(github.ref, 'refs/tags/')
        run: |
          tag="v${{ steps.version.outputs.version }}"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump the version (merging a feat:/fix: PR does) before releasing again."
            exit 1
          fi
          echo "$tag is new"

      # A tag that disagrees with the package version publishes something
      # nobody asked for under a name nobody expects, and PyPI will not let
      # you take it back. Refuse before anything is built.
      - name: Refuse a tag that disagrees with the package version
        if: steps.version.outputs.tag != ''
        run: |
          tag="${{ steps.version.outputs.tag }}"
          declared="${{ steps.version.outputs.version }}"
          if [ "${tag#v}" != "$declared" ]; then
            echo "::error::tag ${tag} does not match pyproject version ${declared}." \
                 "Retag, or fix the version, but do not publish a mismatch."
            exit 1
          fi
          echo "tag ${tag} matches ${declared}"

      # jupyddl exports __version__ as well, and a package whose metadata and
      # runtime disagree is a support ticket waiting to happen.
      - name: Refuse a package whose __version__ disagrees with its metadata
        run: |
          runtime=$(python -c "import re,pathlib; \
            print(re.search(r'^__version__ = \"([^\"]+)\"', \
            pathlib.Path('jupyddl/__init__.py').read_text(), re.M).group(1))")
          declared="${{ steps.version.outputs.version }}"
          if [ "$runtime" != "$declared" ]; then
            echo "::error::jupyddl.__version__ is ${runtime} but pyproject says ${declared}"
            exit 1
          fi
          echo "__version__ matches ${declared}"

      - name: Build the sdist and the wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      # The same smoke test the `build` workflow runs on every PR, repeated
      # here because this is the artefact that actually goes out.
      - name: Install the wheel clean and plan with it
        working-directory: /tmp
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          installed=$(/tmp/fresh/bin/python -c "import jupyddl; print(jupyddl.__version__)")
          if [ "$installed" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::installed wheel reports $installed"
            exit 1
          fi
          /tmp/fresh/bin/jupyddl generate gripper -n 3 --seed 1 -o /tmp/smoke
          /tmp/fresh/bin/jupyddl solve \
            /tmp/smoke/gripper-03-1/domain.pddl \
            /tmp/smoke/gripper-03-1/problem.pddl \
            -s astar -H lmcut | tee /tmp/plan.txt
          grep -q "Valid: True" /tmp/plan.txt

      - name: Extract this version's changelog section
        run: |
          python - <<'PY' > release-notes.md
          import pathlib, re
          version = "${{ steps.version.outputs.version }}"
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          # Everything between this version's heading and the next one.
          match = re.search(
              rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)",
              text, re.M | re.S,
          )
          print(match.group(1).strip() if match else
                f"See CHANGELOG.md for what changed in {version}.")
          PY
          cat release-notes.md

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distributions
          path: |
            dist/
            release-notes.md

  pypi:
    name: publish to ${{ github.event.inputs.target || 'pypi' }}
    needs: build
    runs-on: ubuntu-latest
    # The environment is what a PyPI trusted publisher is scoped to.
    environment:
      name: ${{ github.event.inputs.target || 'pypi' }}
      url: https://pypi.org/project/jupyddl/${{ needs.build.outputs.version }}
    permissions:
      id-token: write  # mint the OIDC token PyPI verifies; no secrets involved
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distributions

      - name: Publish
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: >-
            ${{ github.event.inputs.target == 'testpypi'
                && 'https://test.pypi.org/legacy/' || '' }}
          # A re-run after a partial failure should not fall over on the
          # files that already made it.
          skip-existing: true

  github-release:
    name: cut the GitHub release
    needs: [build, pypi]
    # A release commit, a pushed tag, or a real release from the Actions tab.
    # A TestPyPI dry run deliberately creates neither tag nor release.
    #
    # Deliberately NOT gated on the publish succeeding: the GitHub Release
    # records that a version was cut from a verified commit, and `build` is
    # where every check lives. A failed publish stays red and visible, and
    # re-running just that job finishes the job.
    if: >-
      always()
      && needs.build.result == 'success'
      && (needs.build.outputs.tag != ''
          || github.event.inputs.target == 'pypi')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the release (and, from the tab, the tag)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distributions

      - name: Create the release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ needs.build.outputs.sha }}
          name: jupyddl ${{ needs.build.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, 'rc')
                       || contains(needs.build.outputs.version, 'a')
                       || contains(needs.build.outputs.version, 'b') }}
